
name: Build Lemon Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install LLVM
        run: choco install llvm -y --no-progress

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Lemon Studio
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          cargo build -p os-app --release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Lemon-Studio-Windows
          path: target/release/lemonstudio.exe
